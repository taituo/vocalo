<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Vocalo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238fd3ff'/%3E%3Cstop offset='1' stop-color='%23c58bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" data-state="idle" data-aspect="16:9">
    <div id="bg" class="layer" aria-hidden="true"></div>
    <div id="bg-fallback" class="layer" aria-hidden="true"></div>

    <header id="top">
      <div class="brand"><span class="mark"></span>VOCALO <span id="live" hidden>LIVE</span></div>
      <div id="chips">
        <span class="chip" id="chip-where" hidden></span>
        <span class="chip" id="chip-model" hidden></span>
        <span class="chip" id="chip-mode" hidden></span>
        <span class="chip" id="chip-effort" hidden></span>
        <span class="chip ctx" id="chip-ctx" hidden><i></i><b></b></span>
        <span class="chip state" id="chip-state">ready</span>
      </div>
    </header>

    <section id="center">
      <div id="orb-wrap"><div id="orb"></div><div id="face"></div><div id="orb-fallback"></div></div>
      <div id="headline">
        <h1 id="title">Vocalo</h1>
        <p id="caption">warming up…</p>
      </div>
    </section>

    <section id="panel" hidden>
      <div class="panel-head"><span id="panel-title"></span><button id="panel-close" title="Clear (C)">×</button></div>
      <div id="panel-body"></div>
    </section>

    <aside id="plan" hidden><h3>Plan</h3><ol></ol></aside>

    <div id="lower-third" hidden><span class="bar"></span><span id="lt-text"></span></div>

    <section id="subs">
      <div id="tool" hidden></div>
      <p id="sub-assistant"></p>
      <p id="sub-user" class="empty"><span class="who">YOU</span><span class="txt"></span></p>
    </section>

    <div id="border" class="layer" aria-hidden="true"></div>

    <div id="permission" class="card" hidden>
      <div class="q">May I <b id="perm-title"></b>?</div>
      <div class="res" id="perm-res"></div>
      <div class="actions">
        <button data-perm="allow" class="primary">Allow <kbd>Y</kbd></button>
        <button data-perm="always">Always <kbd>A</kbd></button>
        <button data-perm="reject">Deny <kbd>N</kbd></button>
      </div>
      <div class="hint">or just say “yes” / “kyllä”</div>
    </div>

    <div id="openurl" class="card" hidden>
      <div class="q">Kiro wants to open a sign-in page in your browser.</div>
      <div class="actions"><button id="openurl-btn" class="primary">Open <kbd>O</kbd></button></div>
    </div>

    <div id="overlay" hidden><div class="sheet"><h2></h2><ul></ul><div class="hint">Esc to close</div></div></div>
    <div id="toasts"></div>
  </main>

  <footer id="dock">
    <div id="palette" hidden><span>:</span><input id="palette-input" autocomplete="off" spellcheck="false" placeholder="model haiku · sessions · resume last · steer …  (Enter)"></div>
    <div id="typebox" hidden><span>▸</span><input id="type-input" autocomplete="off" placeholder="type to Vocalo (Enter)"></div>
    <div id="keys">
      <span><kbd>Space</kbd> hold to talk</span><span><kbd>T</kbd> type</span><span><kbd>:</kbd> command</span>
      <span><kbd>Esc</kbd> interrupt</span><span><kbd>M</kbd> mute</span><span><kbd>R</kbd> 16:9/4:3</span>
      <span><kbd>F</kbd> fullscreen</span><span><kbd>V</kbd> face/orb</span><span><kbd>D</kbd> stats</span>
    </div>
    <div id="stats" hidden></div>
    <div id="conn" title="connection to Vocalo"></div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
